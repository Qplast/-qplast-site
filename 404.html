<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>صفحه پیدا نشد | Q Plast</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="assets/logo-header.png" type="image/png" />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/style.css?v=20260905a" />
  <style>
    .error404 {
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 20px;
      gap: 16px;
    }
    .error404__code {
      font-size: clamp(56px, 12vw, 96px);
      font-weight: 700;
      color: var(--gold, #c9a24b);
      line-height: 1;
    }
    .error404__msg {
      font-size: 1.1rem;
      max-width: 480px;
      opacity: 0.85;
    }
    .error404__actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <main class="error404">
    <img src="assets/logo-header.png" alt="Q Plast" width="56" height="56" />
    <div class="error404__code">404</div>
    <h1 class="error404__msg">این صفحه پیدا نشد. ممکن است آدرس اشتباه باشد یا این صفحه جابه‌جا شده باشد.</h1>
    <div class="error404__actions">
      <a href="/" class="btn btn--gold">بازگشت به صفحه اصلی</a>
      <a href="/pages/products.html" class="btn btn--ghost">مشاهده محصولات</a>
    </div>
  </main>
</body>
</html>
