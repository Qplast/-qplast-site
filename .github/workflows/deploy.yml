name: Deploy to cPanel (FTPS)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Upload site via FTPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check site consistency (blocks deploy if pages drifted out of sync)
        run: python3 scripts/check-consistency.py

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy files via FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        shell: bash
        run: |
          PORT="${FTP_PORT:-21}"
          RDIR="${FTP_SERVER_DIR:-public_html}"

          lftp -e "set ftp:ssl-force true; set ftp:ssl-allow true; set ssl:verify-certificate false; set ftp:passive-mode true;" \
            -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$PORT" "$FTP_HOST" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-allow true
          set ssl:verify-certificate false
          set net:timeout 30
          set net:max-retries 3
          set ftp:passive-mode true
          mirror --reverse --delete --ignore-time --transfer-all \
            --exclude-glob .git/ \
            --exclude-glob .github/ \
            --exclude-glob scripts/ \
            --exclude-glob CNAME \
            --exclude-glob .gitignore \
            --parallel=4 \
            . "$RDIR/"
          bye
          EOF