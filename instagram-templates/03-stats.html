<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Instagram Post - Stats</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    .post {
      width: 1080px;
      height: 1080px;
      background: linear-gradient(135deg, #1a1a2e 0%, #0a0a0a 100%);
      font-family: 'Vazirmatn', sans-serif;
      position: relative;
      overflow: hidden;
      direction: rtl;
    }

    .post__circle-1 {
      position: absolute;
      top: -200px;
      right: -200px;
      width: 500px;
      height: 500px;
      border: 1px solid rgba(212,175,55,0.1);
      border-radius: 50%;
    }

    .post__circle-2 {
      position: absolute;
      bottom: -150px;
      left: -150px;
      width: 400px;
      height: 400px;
      border: 1px solid rgba(212,175,55,0.1);
      border-radius: 50%;
    }

    .post__header {
      position: absolute;
      top: 60px;
      right: 60px;
      left: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .post__brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .post__logo {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 800;
      color: #0a0a0a;
    }

    .post__brand-name {
      font-size: 20px;
      font-weight: 600;
      color: #fff;
    }

    .post__content {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      right: 60px;
      left: 60px;
    }

    .post__eyebrow {
      font-size: 18px;
      color: #d4af37;
      font-weight: 500;
      margin-bottom: 20px;
      letter-spacing: 3px;
    }

    .post__title {
      font-size: 48px;
      font-weight: 800;
      color: #fff;
      line-height: 1.4;
      margin-bottom: 50px;
    }

    .post__stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 30px;
    }

    .post__stat {
      text-align: center;
      padding: 40px 20px;
      background: rgba(255,255,255,0.03);
      border-radius: 20px;
      border: 1px solid rgba(212,175,55,0.1);
    }

    .post__stat-value {
      font-size: 56px;
      font-weight: 800;
      color: #d4af37;
      line-height: 1;
      margin-bottom: 12px;
    }

    .post__stat-unit {
      font-size: 24px;
      font-weight: 600;
      color: #d4af37;
    }

    .post__stat-label {
      font-size: 18px;
      color: rgba(255,255,255,0.6);
      margin-top: 8px;
    }

    .post__footer {
      position: absolute;
      bottom: 60px;
      right: 60px;
      left: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .post__cta {
      background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%);
      color: #0a0a0a;
      padding: 16px 40px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
    }

    .post__contact {
      text-align: left;
      direction: ltr;
    }

    .post__contact-item {
      font-size: 16px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="post">
    <div class="post__circle-1"></div>
    <div class="post__circle-2"></div>

    <div class="post__header">
      <div class="post__brand">
        <div class="post__logo">QP</div>
        <span class="post__brand-name">Q Plast</span>
      </div>
    </div>

    <div class="post__content">
      <p class="post__eyebrow">— Q Plast در اعداد</p>
      <h1 class="post__title">چرا برندهای پریمیوم ما را انتخاب می‌کنند؟</h1>
      
      <div class="post__stats">
        <div class="post__stat">
          <div class="post__stat-value">۵</div>
          <div class="post__stat-label">مجموعه محصول</div>
        </div>
        <div class="post__stat">
          <div class="post__stat-value">۸</div>
          <div class="post__stat-label">حجم مختلف</div>
        </div>
        <div class="post__stat">
          <div class="post__stat-value">۵</div>
          <div class="post__stat-label">زبان پشتیبانی</div>
        </div>
      </div>
    </div>

    <div class="post__footer">
      <a class="post__cta" href="#">کشف محصولات</a>
      <div class="post__contact">
        <div class="post__contact-item">Qplast.ir</div>
        <div class="post__contact-item">@Qplast.1</div>
      </div>
    </div>
  </div>
</body>
</html>
