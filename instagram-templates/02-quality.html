<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Instagram Post - Quality</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    .post {
      width: 1080px;
      height: 1080px;
      background: #0a0a0a;
      font-family: 'Vazirmatn', sans-serif;
      position: relative;
      overflow: hidden;
      direction: rtl;
    }

    .post__pattern {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
        linear-gradient(rgba(212,175,55,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(212,175,55,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    .post__gold-line {
      position: absolute;
      top: 0;
      right: 0;
      width: 6px;
      height: 100%;
      background: linear-gradient(180deg, #d4af37 0%, #f4d03f 50%, #d4af37 100%);
    }

    .post__header {
      position: absolute;
      top: 60px;
      right: 80px;
      left: 80px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .post__brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .post__logo {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 800;
      color: #0a0a0a;
    }

    .post__brand-name {
      font-size: 20px;
      font-weight: 600;
      color: #fff;
    }

    .post__content {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      right: 80px;
      left: 80px;
    }

    .post__eyebrow {
      font-size: 18px;
      color: #d4af37;
      font-weight: 500;
      margin-bottom: 30px;
      letter-spacing: 3px;
    }

    .post__title {
      font-size: 52px;
      font-weight: 800;
      color: #fff;
      line-height: 1.4;
      margin-bottom: 50px;
    }

    .post__title span {
      color: #d4af37;
      display: block;
    }

    .post__features {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 30px;
    }

    .post__feature {
      background: rgba(212,175,55,0.05);
      border: 1px solid rgba(212,175,55,0.15);
      border-radius: 16px;
      padding: 30px;
    }

    .post__feature-icon {
      font-size: 32px;
      margin-bottom: 16px;
    }

    .post__feature-title {
      font-size: 20px;
      font-weight: 700;
      color: #d4af37;
      margin-bottom: 8px;
    }

    .post__feature-desc {
      font-size: 16px;
      color: rgba(255,255,255,0.6);
      line-height: 1.6;
    }

    .post__footer {
      position: absolute;
      bottom: 60px;
      right: 80px;
      left: 80px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .post__cta {
      background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%);
      color: #0a0a0a;
      padding: 16px 40px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
    }

    .post__contact {
      text-align: left;
      direction: ltr;
    }

    .post__contact-item {
      font-size: 16px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="post">
    <div class="post__pattern"></div>
    <div class="post__gold-line"></div>

    <div class="post__header">
      <div class="post__brand">
        <div class="post__logo">QP</div>
        <span class="post__brand-name">Q Plast</span>
      </div>
    </div>

    <div class="post__content">
      <p class="post__eyebrow">— تعهد کیفیت</p>
      <h1 class="post__title">پمپ سفارش دوم، <span>پمپ سفارش اول</span></h1>
      
      <div class="post__features">
        <div class="post__feature">
          <div class="post__feature-icon">◆</div>
          <h3 class="post__feature-title">ثبات کیفیت</h3>
          <p class="post__feature-desc">کیفیت میان بچ‌های مختلف یکسان باقی می‌ماند</p>
        </div>
        <div class="post__feature">
          <div class="post__feature-icon">◆</div>
          <h3 class="post__feature-title">تلورانس کنترل‌شده</h3>
          <p class="post__feature-desc">دقت ابعادی در هر مرحله تولید</p>
        </div>
        <div class="post__feature">
          <div class="post__feature-icon">◆</div>
          <h3 class="post__feature-title">مستندات شفاف</h3>
          <p class="post__feature-desc">گزارش‌های قابل ارائه برای ممیزی</p>
        </div>
        <div class="post__feature">
          <div class="post__feature-icon">◆</div>
          <h3 class="post__feature-title">کنترل فرآیند</h3>
          <p class="post__feature-desc">نظارت در هر مرحله تولید</p>
        </div>
      </div>
    </div>

    <div class="post__footer">
      <a class="post__cta" href="#">مشاهده تعهد کیفیت</a>
      <div class="post__contact">
        <div class="post__contact-item">Qplast.ir</div>
        <div class="post__contact-item">@Qplast.1</div>
      </div>
    </div>
  </div>
</body>
</html>
