<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Instagram Post - Comparison</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    .post {
      width: 1080px;
      height: 1080px;
      background: #0a0a0a;
      font-family: 'Vazirmatn', sans-serif;
      position: relative;
      overflow: hidden;
      direction: rtl;
    }

    .post__accent {
      position: absolute;
      top: 0;
      right: 0;
      width: 100%;
      height: 8px;
      background: linear-gradient(90deg, #d4af37, #f4d03f, #d4af37);
    }

    .post__header {
      position: absolute;
      top: 60px;
      right: 60px;
      left: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .post__brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .post__logo {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 800;
      color: #0a0a0a;
    }

    .post__brand-name {
      font-size: 20px;
      font-weight: 600;
      color: #fff;
    }

    .post__content {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      right: 60px;
      left: 60px;
    }

    .post__eyebrow {
      font-size: 18px;
      color: #d4af37;
      font-weight: 500;
      margin-bottom: 20px;
      letter-spacing: 3px;
    }

    .post__title {
      font-size: 44px;
      font-weight: 800;
      color: #fff;
      line-height: 1.4;
      margin-bottom: 40px;
    }

    .post__comparison {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 30px;
      align-items: center;
    }

    .post__col {
      background: rgba(255,255,255,0.03);
      border-radius: 20px;
      padding: 40px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .post__col--us {
      border-color: rgba(212,175,55,0.3);
      background: rgba(212,175,55,0.05);
    }

    .post__col-header {
      font-size: 18px;
      color: rgba(255,255,255,0.5);
      margin-bottom: 20px;
      text-align: center;
    }

    .post__col--us .post__col-header {
      color: #d4af37;
    }

    .post__col-title {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      text-align: center;
      margin-bottom: 24px;
    }

    .post__col--us .post__col-title {
      color: #d4af37;
    }

    .post__feature {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .post__feature-check {
      width: 24px;
      height: 24px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: rgba(255,255,255,0.5);
    }

    .post__col--us .post__feature-check {
      background: rgba(212,175,55,0.2);
      color: #d4af37;
    }

    .post__feature-text {
      font-size: 18px;
      color: rgba(255,255,255,0.7);
    }

    .post__vs {
      font-size: 32px;
      font-weight: 800;
      color: rgba(255,255,255,0.3);
    }

    .post__footer {
      position: absolute;
      bottom: 60px;
      right: 60px;
      left: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .post__cta {
      background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%);
      color: #0a0a0a;
      padding: 16px 40px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
    }

    .post__contact {
      text-align: left;
      direction: ltr;
    }

    .post__contact-item {
      font-size: 16px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="post">
    <div class="post__accent"></div>

    <div class="post__header">
      <div class="post__brand">
        <div class="post__logo">QP</div>
        <span class="post__brand-name">Q Plast</span>
      </div>
    </div>

    <div class="post__content">
      <p class="post__eyebrow">— چرا Q Plast؟</p>
      <h1 class="post__title">چه چیزی ما را متمایز می‌کند؟</h1>
      
      <div class="post__comparison">
        <div class="post__col post__col--us">
          <p class="post__col-header">Q Plast</p>
          <h3 class="post__col-title">همتا و آریا</h3>
          <div class="post__feature">
            <span class="post__feature-check">✓</span>
            <span class="post__feature-text">تخصص فقط در پمپ آرایشی</span>
          </div>
          <div class="post__feature">
            <span class="post__feature-check">✓</span>
            <span class="post__feature-text">کیفیت پریمیوم</span>
          </div>
          <div class="post__feature">
            <span class="post__feature-check">✓</span>
            <span class="post__feature-text">پشتیبانی فنی</span>
          </div>
          <div class="post__feature">
            <span class="post__feature-check">✓</span>
            <span class="post__feature-text">تحویل سریع</span>
          </div>
        </div>
        
        <span class="post__vs">VS</span>
        
        <div class="post__col">
          <p class="post__col-header">سایر تولیدکنندگان</p>
          <h3 class="post__col-title">محصولات عمومی</h3>
          <div class="post__feature">
            <span class="post__feature-check">—</span>
            <span class="post__feature-text">تولید انواع بسته‌بندی</span>
          </div>
          <div class="post__feature">
            <span class="post__feature-check">—</span>
            <span class="post__feature-text">کیفیت متغیر</span>
          </div>
          <div class="post__feature">
            <span class="post__feature-check">—</span>
            <span class="post__feature-text">پشتیبانی محدود</span>
          </div>
          <div class="post__feature">
            <span class="post__feature-check">—</span>
            <span class="post__feature-text">زمان تحویل طولانی</span>
          </div>
        </div>
      </div>
    </div>

    <div class="post__footer">
      <a class="post__cta" href="#">مقایسه محصولات</a>
      <div class="post__contact">
        <div class="post__contact-item">Qplast.ir</div>
        <div class="post__contact-item">@Qplast.1</div>
      </div>
    </div>
  </div>
</body>
</html>
