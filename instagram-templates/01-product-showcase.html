<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Instagram Post - Product Showcase</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    .post {
      width: 1080px;
      height: 1080px;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
      font-family: 'Vazirmatn', sans-serif;
      position: relative;
      overflow: hidden;
      direction: rtl;
    }

    .post__accent {
      position: absolute;
      top: 0;
      right: 0;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(212,175,55,0.15) 0%, transparent 70%);
    }

    .post__accent-2 {
      position: absolute;
      bottom: -100px;
      left: -100px;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(212,175,55,0.1) 0%, transparent 70%);
    }

    .post__header {
      position: absolute;
      top: 60px;
      right: 60px;
      left: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .post__brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .post__logo {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 800;
      color: #0a0a0a;
    }

    .post__brand-name {
      font-size: 22px;
      font-weight: 600;
      color: #fff;
    }

    .post__badge {
      background: rgba(212,175,55,0.2);
      border: 1px solid rgba(212,175,55,0.4);
      padding: 8px 20px;
      border-radius: 30px;
      font-size: 16px;
      color: #d4af37;
      font-weight: 500;
    }

    .post__content {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      right: 60px;
      left: 60px;
    }

    .post__eyebrow {
      font-size: 18px;
      color: #d4af37;
      font-weight: 500;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }

    .post__title {
      font-size: 56px;
      font-weight: 800;
      color: #fff;
      line-height: 1.3;
      margin-bottom: 24px;
    }

    .post__title span {
      color: #d4af37;
    }

    .post__desc {
      font-size: 22px;
      color: rgba(255,255,255,0.7);
      line-height: 1.8;
      max-width: 700px;
    }

    .post__specs {
      display: flex;
      gap: 40px;
      margin-top: 40px;
    }

    .post__spec {
      text-align: center;
    }

    .post__spec-value {
      font-size: 36px;
      font-weight: 800;
      color: #d4af37;
    }

    .post__spec-label {
      font-size: 16px;
      color: rgba(255,255,255,0.6);
      margin-top: 4px;
    }

    .post__footer {
      position: absolute;
      bottom: 60px;
      right: 60px;
      left: 60px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .post__cta {
      background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%);
      color: #0a0a0a;
      padding: 16px 40px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
    }

    .post__contact {
      text-align: left;
      direction: ltr;
    }

    .post__contact-item {
      font-size: 16px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 4px;
    }

    .post__contact-item span {
      color: #d4af37;
    }

    .post__line {
      position: absolute;
      right: 60px;
      bottom: 160px;
      left: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212,175,55,0.3), transparent);
    }
  </style>
</head>
<body>
  <div class="post">
    <div class="post__accent"></div>
    <div class="post__accent-2"></div>

    <div class="post__header">
      <div class="post__brand">
        <div class="post__logo">QP</div>
        <span class="post__brand-name">Q Plast</span>
      </div>
      <span class="post__badge">پمپ آرایشی پریمیوم</span>
    </div>

    <div class="post__content">
      <p class="post__eyebrow">— معرفی محصول</p>
      <h1 class="post__title">پمپ آرایشی <span>همتا</span></h1>
      <p class="post__desc">میست و لوسیون برای طیف کامل محصولات آرایشی — کیفیت پریمیوم، قیمت رقابتی</p>
      
      <div class="post__specs">
        <div class="post__spec">
          <div class="post__spec-value">۲۴</div>
          <div class="post__spec-label">دهانه (mm)</div>
        </div>
        <div class="post__spec">
          <div class="post__spec-value">۹۰-۲۲۰</div>
          <div class="post__spec-label">حجم (ml)</div>
        </div>
        <div class="post__spec">
          <div class="post__spec-value">۵</div>
          <div class="post__spec-label">نوع محصول</div>
        </div>
      </div>
    </div>

    <div class="post__line"></div>

    <div class="post__footer">
      <a class="post__cta" href="#">استعلام قیمت</a>
      <div class="post__contact">
        <div class="post__contact-item">Qplast.ir</div>
        <div class="post__contact-item">@Qplast.1</div>
      </div>
    </div>
  </div>
</body>
</html>
