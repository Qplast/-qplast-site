<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Instagram Post - CTA</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    .post {
      width: 1080px;
      height: 1080px;
      background: linear-gradient(135deg, #d4af37 0%, #b8860b 50%, #d4af37 100%);
      font-family: 'Vazirmatn', sans-serif;
      position: relative;
      overflow: hidden;
      direction: rtl;
    }

    .post__pattern {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
        radial-gradient(circle at 20% 80%, rgba(0,0,0,0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(255,255,255,0.1) 0%, transparent 50%);
    }

    .post__dark-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 900px;
      height: 900px;
      background: rgba(0,0,0,0.85);
      border-radius: 50%;
    }

    .post__header {
      position: absolute;
      top: 60px;
      right: 60px;
      left: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .post__brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .post__logo {
      width: 50px;
      height: 50px;
      background: #fff;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 800;
      color: #d4af37;
    }

    .post__brand-name {
      font-size: 20px;
      font-weight: 600;
      color: #fff;
    }

    .post__content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      width: 700px;
      z-index: 10;
    }

    .post__eyebrow {
      font-size: 18px;
      color: #d4af37;
      font-weight: 500;
      margin-bottom: 30px;
      letter-spacing: 3px;
    }

    .post__title {
      font-size: 52px;
      font-weight: 800;
      color: #fff;
      line-height: 1.4;
      margin-bottom: 30px;
    }

    .post__title span {
      color: #d4af37;
    }

    .post__desc {
      font-size: 22px;
      color: rgba(255,255,255,0.7);
      line-height: 1.8;
      margin-bottom: 50px;
    }

    .post__cta {
      display: inline-block;
      background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%);
      color: #0a0a0a;
      padding: 20px 60px;
      border-radius: 40px;
      font-size: 22px;
      font-weight: 700;
      text-decoration: none;
      margin-bottom: 30px;
    }

    .post__contact {
      font-size: 18px;
      color: rgba(255,255,255,0.6);
      direction: ltr;
    }

    .post__contact span {
      color: #d4af37;
    }

    .post__footer {
      position: absolute;
      bottom: 60px;
      right: 60px;
      left: 60px;
      text-align: center;
      z-index: 10;
    }

    .post__footer-text {
      font-size: 16px;
      color: rgba(255,255,255,0.5);
    }
  </style>
</head>
<body>
  <div class="post">
    <div class="post__pattern"></div>
    <div class="post__dark-overlay"></div>

    <div class="post__header">
      <div class="post__brand">
        <div class="post__logo">QP</div>
        <span class="post__brand-name">Q Plast</span>
      </div>
    </div>

    <div class="post__content">
      <p class="post__eyebrow">— شروع همکاری</p>
      <h1 class="post__title">آماده‌اید <span>تجربه‌ی محصول</span> خود را ارتقا دهید؟</h1>
      <p class="post__desc">فرم استعلام را پر کنید؛ تیم ما با پیش‌فاکتور و مشاوره فنی در سریع‌ترین زمان پاسخ می‌دهد.</p>
      <a class="post__cta" href="#">درخواست نمونه و قیمت</a>
      <p class="post__contact"><span>sales@qplast.ir</span> | <span>@Qplast.1</span></p>
    </div>

    <div class="post__footer">
      <p class="post__footer-text">Industrial Precision. Premium Feel.</p>
    </div>
  </div>
</body>
</html>
